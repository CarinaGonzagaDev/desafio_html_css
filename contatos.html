<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/contato.css">
</head>
<body>

    <header>
          <img src="img/logo-ford-256.png" alt="logo da marca cabecalho">

        <nav>
            <ul>
                <a href="home.html"><li>Home</li></a>
                <a href="lancamentos.html"><li>Lançamentos</li></a>
                <a href="contatos.html"><li>Contatos</li></a>
            </ul>
        </nav>
        <div></div>
    </header>

    <main class="contatoPagina">
        <div class="contato-imagem">
            <img src="/img/xls 2.2 diesel.jpg" alt="Veiculo Contato">
        </div>
        <section class="formularioContainer">
            <form class="formulario">
                <h3>Sobre Você</h3>

                <div class="inputGrupo">
                    <input type="text" placeholder="Nome completo">
                </div>
                <div class="inputGrupo">
                    <input type="email" placeholder="E-mail para contato">
                </div>
                <div class="inputGrupo">
                    <input type="tel" placeholder="Telefone">
                </div>
                <div class="inputGrupo">
                    <select>
                        <option value="" disabled selected hidden>Tipo de contato</option>
                        <option value="elogio">Elogio</option>
                        <option value="reclamacao">Reclamação</option>
                        <option value="solicitacao">Solicitação</option>
                    </select>
                </div>
                <div class="inputGrupo">
                    <textarea placeholder="Sua mensagem" rows="2"></textarea>
                </div>

                <button type="submit" class="submitbotao">
                    <span>Enviar Mensagem</span>
                </button>
            </form>
        </section>
    </main>

    <footer >
        <div class="redesSociais">
            <p>Redes Sociais</p>
            <a href="https://www.facebook.com/FordBrasil/?locale=pt_BR" target="_blank"><img src="img/facebook-50.png" alt="facebook"></a>
            <a href="https://www.youtube.com/fordbrasil" target="_blank"><img src="img/youtube-squared-50.png" alt="youtube"></a>
            <a href="https://www.instagram.com/fordbrasil/" target="_blank"><img src="img/instagram-logo-50.png" alt="instagram"></a>
        </div>

        <div class="direitosAutorais">
            <p>&copy; 2025 Ford Motor Company todos os direitos reservados</p>
        </div>

        <div class="logo-footer">
            <img src="img/ford-96.png" alt="logo rodape">
        </div>
    </footer>
</body>
</html>
